<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lista de Missões</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #05070d;
            background-image:
                radial-gradient(
                    circle at 20% 30%,
                    rgba(255, 255, 255, 0.8) 1px,
                    transparent 1px
                ),
                radial-gradient(
                    circle at 70% 60%,
                    rgba(255, 255, 255, 0.6) 1px,
                    transparent 1px
                );
            background-size: 90px 90px, 130px 130px;
            color: #ffffff;
        }

        h1 {
            margin-bottom: 30px;
            color: #ffe81f;
            font-size: 38px;
            letter-spacing: 3px;
            text-align: center;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 232, 31, 0.7);
        }

        .area-botoes {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            overflow: hidden;
            border: 1px solid #2f415e;
            border-collapse: collapse;
            border-radius: 10px;
            background-color: rgba(12, 18, 30, 0.95);
            box-shadow: 0 0 25px rgba(0, 140, 255, 0.25);
        }

        thead {
            background-color: #111827;
            color: #ffe81f;
        }

        th {
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        th,
        td {
            padding: 14px;
            border-bottom: 1px solid #26354a;
            text-align: left;
            vertical-align: middle;
        }

        tbody tr {
            transition: 0.2s;
        }

        tbody tr:hover {
            background-color: rgba(0, 119, 255, 0.15);
            box-shadow: inset 4px 0 0 #38bdf8;
        }

        a {
            display: inline-block;
            margin: 3px;
            padding: 8px 12px;
            border: 1px solid #38bdf8;
            border-radius: 5px;
            background-color: transparent;
            color: #38bdf8;
            font-size: 13px;
            font-weight: bold;
            text-decoration: none;
            transition: 0.2s;
        }

        a:hover {
            background-color: #38bdf8;
            color: #05070d;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.8);
            transform: translateY(-1px);
        }

        .botao-novo {
            border-color: #22c55e;
            color: #22c55e;
        }

        .botao-novo:hover {
            background-color: #22c55e;
            color: #05070d;
            box-shadow: 0 0 12px rgba(34, 197, 94, 0.8);
        }

        .botao-alterar {
            border-color: #ffe81f;
            color: #ffe81f;
        }

        .botao-alterar:hover {
            background-color: #ffe81f;
            color: #05070d;
            box-shadow: 0 0 12px rgba(255, 232, 31, 0.8);
        }

        .botao-deletar {
            border-color: #ef4444;
            color: #ef4444;
        }

        .botao-deletar:hover {
            background-color: #ef4444;
            color: #ffffff;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.8);
        }

        .mensagem {
            margin-bottom: 20px;
            padding: 12px;
            border: 1px solid #38bdf8;
            border-radius: 5px;
            background-color: rgba(56, 189, 248, 0.1);
            color: #ffffff;
            text-align: center;
        }

        .lista-vazia {
            padding: 30px;
            color: #9ca3af;
            text-align: center;
        }

        @media (max-width: 900px) {
            body {
                padding: 15px;
            }

            table {
                display: block;
                overflow-x: auto;
                white-space: nowrap;
            }

            h1 {
                font-size: 28px;
            }

            .area-botoes {
                justify-content: center;
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

    <h1>Lista de Missões</h1>

    <div
        class="mensagem"
        th:if="${mensagem}"
        th:text="${mensagem}">
    </div>

    <div class="area-botoes">

        <a th:href="@{/jedi/ui/listar}">
            Ver Jedi
        </a>

        <a
            class="botao-novo"
            th:href="@{/missoes/ui/adicionar}">
            + Criar nova missão
        </a>

    </div>

    <table>

        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Dificuldade</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody>

            <tr th:if="${#lists.isEmpty(missoes)}">
                <td
                    class="lista-vazia"
                    colspan="4">
                    Nenhuma missão cadastrada.
                </td>
            </tr>

            <tr th:each="missao : ${missoes}">

                <td th:text="${missao.id}"></td>

                <td th:text="${missao.nome}"></td>

                <td th:text="${missao.dificuldade}"></td>

                <td>

                    <a th:href="@{/missoes/ui/listar/{id}(id=${missao.id})}">
                        Ver detalhes
                    </a>

                    <a
                        class="botao-alterar"
                        th:href="@{/missoes/ui/alterar/{id}(id=${missao.id})}">
                        Alterar
                    </a>

                    <a
                        class="botao-deletar"
                        th:href="@{/missoes/ui/delete/{id}(id=${missao.id})}"
                        onclick="return confirm('Tem certeza que deseja deletar esta missão?')">
                        Deletar
                    </a>

                </td>

            </tr>

        </tbody>

    </table>

</body>

</html>
