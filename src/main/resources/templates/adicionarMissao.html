<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar Missão</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 40px;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #05070d;
            color: #ffffff;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 30px;
            border: 1px solid #2f415e;
            border-radius: 10px;
            background-color: rgba(12, 18, 30, 0.95);
            box-shadow: 0 0 25px rgba(0, 140, 255, 0.25);
        }

        h1 {
            margin-top: 0;
            color: #ffe81f;
            text-align: center;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 232, 31, 0.7);
        }

        .campo {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #38bdf8;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #2f415e;
            border-radius: 5px;
            background-color: #111827;
            color: #ffffff;
            font-size: 16px;
        }

        input:focus,
        select:focus {
            border-color: #38bdf8;
            outline: none;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }

        .acoes {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        button,
        a {
            flex: 1;
            padding: 12px;
            border: 1px solid #38bdf8;
            border-radius: 5px;
            background-color: transparent;
            color: #38bdf8;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            transition: 0.2s;
        }

        button {
            border-color: #22c55e;
            color: #22c55e;
        }

        button:hover {
            background-color: #22c55e;
            color: #05070d;
        }

        a:hover {
            background-color: #38bdf8;
            color: #05070d;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Criar Missão</h1>

        <form
            th:action="@{/missoes/ui/salvar}"
            th:object="${missao}"
            method="post">

            <div class="campo">
                <label for="nome">
                    Nome da missão
                </label>

                <input
                    id="nome"
                    type="text"
                    th:field="*{nome}"
                    placeholder="Digite o nome da missão"
                    required>
            </div>

            <div class="campo">
                <label for="dificuldade">
                    Dificuldade
                </label>

                <select
                    id="dificuldade"
                    th:field="*{dificuldade}"
                    required>

                    <option value="">
                        Selecione a dificuldade
                    </option>

                    <option value="E">E</option>
                    <option value="D">D</option>
                    <option value="C">C</option>
                    <option value="B">B</option>
                    <option value="A">A</option>
                    <option value="S">S</option>

                </select>
            </div>

            <div class="acoes">

                <button type="submit">
                    Cadastrar missão
                </button>

                <a th:href="@{/missoes/ui/listar}">
                    Cancelar
                </a>

            </div>

        </form>

    </div>

</body>

</html>
