<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Detalhes da Missão</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 40px;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #05070d;
            color: #ffffff;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 30px;
            border: 1px solid #2f415e;
            border-radius: 10px;
            background-color: rgba(12, 18, 30, 0.95);
            box-shadow: 0 0 25px rgba(0, 140, 255, 0.25);
        }

        h1 {
            margin-top: 0;
            color: #ffe81f;
            text-align: center;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 232, 31, 0.7);
        }

        .informacao {
            margin-bottom: 15px;
            padding: 15px;
            border-left: 4px solid #38bdf8;
            background-color: #111827;
        }

        .informacao strong {
            color: #38bdf8;
        }

        .acoes {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        a {
            flex: 1;
            padding: 12px;
            border: 1px solid #38bdf8;
            border-radius: 5px;
            color: #38bdf8;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            transition: 0.2s;
        }

        a:hover {
            background-color: #38bdf8;
            color: #05070d;
        }

        .botao-alterar {
            border-color: #ffe81f;
            color: #ffe81f;
        }

        .botao-alterar:hover {
            background-color: #ffe81f;
            color: #05070d;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Detalhes da Missão</h1>

        <div class="informacao">
            <strong>ID:</strong>
            <span th:text="${missao.id}"></span>
        </div>

        <div class="informacao">
            <strong>Nome:</strong>
            <span th:text="${missao.nome}"></span>
        </div>

        <div class="informacao">
            <strong>Dificuldade:</strong>
            <span th:text="${missao.dificuldade}"></span>
        </div>

        <div class="acoes">

            <a
                class="botao-alterar"
                th:href="@{/missoes/ui/alterar/{id}(id=${missao.id})}">
                Alterar missão
            </a>

            <a th:href="@{/missoes/ui/listar}">
                Voltar
            </a>

        </div>

    </div>

</body>

</html>
