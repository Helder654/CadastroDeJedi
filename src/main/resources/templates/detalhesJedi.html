<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Detalhes do Jedi</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, Helvetica, sans-serif;
            color: white;
            background-color: #03060c;

            background-image:
                radial-gradient(
                    circle at 10% 20%,
                    white 1px,
                    transparent 1px
                ),
                radial-gradient(
                    circle at 70% 50%,
                    #cbd5e1 1px,
                    transparent 1px
                ),
                radial-gradient(
                    circle at 40% 80%,
                    white 1px,
                    transparent 1px
                );

            background-size:
                110px 110px,
                160px 160px,
                210px 210px;
        }

        .detalhes-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 30px;
            color: #ffe81f;
            font-size: 38px;
            letter-spacing: 4px;
            text-align: center;
            text-transform: uppercase;

            text-shadow:
                0 0 8px #ffe81f,
                0 0 18px rgba(255, 232, 31, 0.5);
        }

        .jedi-card {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            padding: 35px;
            border: 1px solid #1e3a5f;
            border-radius: 18px;
            background-color: rgba(8, 15, 28, 0.96);
            text-align: center;

            box-shadow:
                0 0 25px rgba(56, 189, 248, 0.25),
                inset 0 0 25px rgba(56, 189, 248, 0.04);
        }

        .jedi-imagem {
            display: block;
            width: 150px;
            height: 150px;
            margin: 0 auto 18px;
            border: 3px solid #38bdf8;
            border-radius: 50%;
            object-fit: cover;

            box-shadow:
                0 0 12px #38bdf8,
                0 0 30px rgba(56, 189, 248, 0.55);
        }

        .imagem-placeholder {
            display: flex;
            width: 150px;
            height: 150px;
            margin: 0 auto 18px;
            align-items: center;
            justify-content: center;
            border: 3px solid #38bdf8;
            border-radius: 50%;
            background-color: #0d1728;
            color: #94a3b8;
            font-weight: bold;
        }

        .jedi-card h2 {
            margin: 5px 0 25px;
            color: white;
            font-size: 30px;
        }

        .jedi-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            max-width: 650px;
            margin: 0 auto 30px;
            text-align: left;
        }

        .jedi-info p {
            margin: 0;
            padding: 14px 16px;
            border: 1px solid #223550;
            border-radius: 8px;
            background-color: #0d1728;
            color: #e2e8f0;
        }

        .jedi-info strong {
            color: #ffe81f;
        }

        h3 {
            margin: 30px 0 15px;
            color: #38bdf8;
            font-size: 23px;
            text-align: left;
            text-transform: uppercase;
        }

        table {
            width: 100%;
            overflow: hidden;
            border: 1px solid #253750;
            border-collapse: collapse;
            border-radius: 10px;
            background-color: #08111f;
        }

        thead {
            background-color: #111c2e;
        }

        th {
            color: #ffe81f;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        th,
        td {
            padding: 15px 18px;
            border-bottom: 1px solid #253750;
            text-align: left;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody tr:hover {
            background-color: rgba(56, 189, 248, 0.09);
        }

        .area-voltar {
            display: flex;
            width: 100%;
            max-width: 700px;
            margin: 25px auto 0;
            justify-content: flex-start;
        }

        .botao-voltar {
            display: inline-block;
            padding: 11px 18px;
            border: 1px solid #38bdf8;
            border-radius: 6px;
            color: #38bdf8;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            transition: 0.2s;
        }

        .botao-voltar:hover {
            background-color: #38bdf8;
            color: #03060c;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.8);
            transform: translateY(-2px);
        }

        @media (max-width: 650px) {
            body {
                padding: 25px 12px;
            }

            h1 {
                font-size: 27px;
            }

            .jedi-card {
                padding: 25px 15px;
            }

            .jedi-info {
                grid-template-columns: 1fr;
            }

            table {
                display: block;
                overflow-x: auto;
            }

            .botao-voltar {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <main class="detalhes-container">

        <h1>Detalhes do Jedi</h1>

        <section class="jedi-card">

            <img
                th:if="${jedi.imagemUrl != null and !#strings.isEmpty(jedi.imagemUrl)}"
                th:src="${jedi.imagemUrl}"
                th:alt="|Imagem de ${jedi.nome}|"
                class="jedi-imagem"
                referrerpolicy="no-referrer">

            <div
                th:if="${jedi.imagemUrl == null or #strings.isEmpty(jedi.imagemUrl)}"
                class="imagem-placeholder">
                Sem imagem
            </div>

            <h2 th:text="${jedi.nome}">Nome do Jedi</h2>

            <div class="jedi-info">

                <p>
                    <strong>ID:</strong>
                    <span th:text="${jedi.id}"></span>
                </p>

                <p>
                    <strong>Idade:</strong>
                    <span th:text="${jedi.idade}"></span>
                </p>

                <p>
                    <strong>Email:</strong>
                    <span th:text="${jedi.email}"></span>
                </p>

                <p>
                    <strong>Rank:</strong>
                    <span th:text="${jedi.rank}"></span>
                </p>

            </div>

            <h3>Missões</h3>

            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Dificuldade</th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:if="${jedi.missoes != null}">
                        <td th:text="${jedi.missoes.nome}"></td>
                        <td th:text="${jedi.missoes.dificuldade}"></td>
                    </tr>

                    <tr th:if="${jedi.missoes == null}">
                        <td colspan="2">
                            Nenhuma missão cadastrada para este Jedi
                        </td>
                    </tr>

                </tbody>
            </table>

        </section>

        <div class="area-voltar">
            <a
                class="botao-voltar"
                th:href="@{/jedi/ui/listar}">
                Voltar para a lista de Jedi
            </a>
        </div>

    </main>

</body>

</html>
