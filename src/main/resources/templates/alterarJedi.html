<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alterar Jedi</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, Helvetica, sans-serif;
            color: white;
            background-color: #03060c;

            background-image:
                radial-gradient(
                    circle at 10% 20%,
                    white 1px,
                    transparent 1px
                ),
                radial-gradient(
                    circle at 70% 50%,
                    #cbd5e1 1px,
                    transparent 1px
                ),
                radial-gradient(
                    circle at 40% 80%,
                    white 1px,
                    transparent 1px
                );

            background-size:
                110px 110px,
                160px 160px,
                210px 210px;
        }

        .pagina-container {
            width: 100%;
            max-width: 650px;
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 30px;
            color: #ffe81f;
            font-size: 38px;
            letter-spacing: 4px;
            text-align: center;
            text-transform: uppercase;

            text-shadow:
                0 0 8px #ffe81f,
                0 0 18px rgba(255, 232, 31, 0.5);
        }

        .form-container {
            padding: 35px;
            border: 1px solid #1e3a5f;
            border-radius: 18px;
            background-color: rgba(8, 15, 28, 0.96);

            box-shadow:
                0 0 25px rgba(56, 189, 248, 0.25),
                inset 0 0 25px rgba(56, 189, 248, 0.04);
        }

        .mensagem {
            margin-bottom: 20px;
            padding: 12px;
            border: 1px solid #22c55e;
            border-radius: 7px;
            background-color: rgba(34, 197, 94, 0.12);
            color: #86efac;
            font-weight: bold;
            text-align: center;
        }

        .campo {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #ffe81f;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        input,
        select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #2a4569;
            border-radius: 7px;
            outline: none;
            background-color: #0d1728;
            color: white;
            font-size: 15px;
            transition: 0.2s;
        }

        input::placeholder {
            color: #64748b;
        }

        input:focus,
        select:focus {
            border-color: #38bdf8;

            box-shadow:
                0 0 0 3px rgba(56, 189, 248, 0.15),
                0 0 12px rgba(56, 189, 248, 0.35);
        }

        select option {
            background-color: #0d1728;
            color: white;
        }

        .texto-ajuda {
            display: block;
            margin-top: 6px;
            color: #94a3b8;
            font-size: 12px;
        }

        .botao-cadastrar {
            width: 100%;
            margin-top: 8px;
            padding: 13px;
            border: 1px solid #38bdf8;
            border-radius: 7px;
            background-color: transparent;
            color: #38bdf8;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .botao-cadastrar:hover {
            background-color: #38bdf8;
            color: #03060c;

            box-shadow:
                0 0 15px rgba(56, 189, 248, 0.8);

            transform: translateY(-2px);
        }

        .area-voltar {
            margin-top: 22px;
        }

        .botao-voltar {
            display: inline-block;
            padding: 10px 17px;
            border: 1px solid #ffe81f;
            border-radius: 6px;
            color: #ffe81f;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            transition: 0.2s;
        }

        .botao-voltar:hover {
            background-color: #ffe81f;
            color: #03060c;

            box-shadow:
                0 0 15px rgba(255, 232, 31, 0.7);

            transform: translateY(-2px);
        }

        @media (max-width: 650px) {
            body {
                padding: 25px 12px;
            }

            h1 {
                font-size: 28px;
            }

            .form-container {
                padding: 25px 18px;
            }

            .botao-voltar {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>

<main class="pagina-container">

    <h1>Alterar Jedi</h1>

    <section class="form-container">

        <form
            th:action="@{/jedi/ui/atualizar/{id}(id=${jedi.id})}"
            th:object="${jedi}"
            method="post">

            <input type="hidden" th:field="*{id}">

            <div class="campo">
                <label for="nome">Nome</label>

                <input
                    type="text"
                    id="nome"
                    th:field="*{nome}"
                    required>
            </div>

            <div class="campo">
                <label for="email">E-mail</label>

                <input
                    type="email"
                    id="email"
                    th:field="*{email}"
                    required>
            </div>

            <div class="campo">
                <label for="idade">Idade</label>

                <input
                    type="number"
                    id="idade"
                    th:field="*{idade}"
                    min="0"
                    required>
            </div>

            <div class="campo">
                <label for="rank">Rank</label>

                <input
                    type="text"
                    id="rank"
                    th:field="*{rank}"
                    required>
            </div>

            <div class="campo">
                <label for="imagemUrl">URL da imagem</label>

                <input
                    type="url"
                    id="imagemUrl"
                    th:field="*{imagemUrl}">
            </div>

            <button type="submit" class="botao-cadastrar">
                Salvar alterações
            </button>

        </form>

    </section>

    <div class="area-voltar">
        <a class="botao-voltar" th:href="@{/jedi/ui/listar}">
            Cancelar e voltar
        </a>
    </div>

</main>

</body>

</html>
